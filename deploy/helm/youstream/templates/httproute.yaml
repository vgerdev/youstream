# Attaches the web pods to the shared Gateway's HTTPS listener. Upload chunks get a longer request timeout than
# Envoy's default; HLS segments and API calls are short.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "youstream.fullname" . }}
  labels:
    {{- include "youstream.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/uploads
      timeouts:
        request: {{ .Values.gateway.uploadTimeout }}
      backendRefs:
        - name: {{ include "youstream.fullname" . }}-web
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: {{ .Values.gateway.requestTimeout }}
      backendRefs:
        - name: {{ include "youstream.fullname" . }}-web
          port: 8080
