{{- if not .Values.persistence.existingClaim }}
# The media volume (originals, HLS output, SFTP inboxes). Kept when the release is uninstalled.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "youstream.claimName" . }}
  labels:
    {{- include "youstream.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
