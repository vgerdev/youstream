# YouStream defaults. Put secrets in conf/local.conf (git-ignored) or environment variables.

# What this process runs: any of web (HTTP API + UI + media), sftp, transcode (FFmpeg workers).
# One local process runs all three; in Kubernetes each Deployment runs one, e.g. YOUSTREAM_ROLES=web.
roles = [web, sftp, transcode]
roles = ${?YOUSTREAM_ROLES}

server {
  port = 8080
  port = ${?HTTP_PORT}
  maxRequestSize = 32m
  # reverse proxies in front of this server whose X-Forwarded-For entries are trusted (gateway = 1); 0 = none.
  # Never set it when clients can reach the port directly: they could claim any address.
  trustedProxyHops = 0
  trustedProxyHops = ${?TRUSTED_PROXY_HOPS}
}

app {
  # public address of the web UI, used in links handed to users (SFTP status files)
  publicUrl = "http://localhost:8080"
  publicUrl = ${?PUBLIC_URL}
}

db {
  url = ${?DB_URL}
  user = ${?DB_USER}
  password = ${?DB_PASSWORD}
  poolSize = 10
  poolSize = ${?DB_POOL_SIZE}
  # apply Flyway migrations on start; Kubernetes runs "youstream migrate" as a Job and sets this to false
  migrate = true
  migrate = ${?DB_MIGRATE}
}

# Username/password login against an LDAP directory (also used for SFTP password auth).
# Defaults point at the embedded dev directory: gradle :youstream-devldap:run (port 10389).
ldap {
  enabled = true
  enabled = ${?LDAP_ENABLED}
  url = "ldap://localhost:10389"
  url = ${?LDAP_URL}
  # "search": bind as service account, find the user with userFilter, then bind as the user (OpenLDAP, lldap, dev LDAP, AD)
  # "upn":    bind directly as username@upnDomain (Active Directory only)
  mode = "search"
  baseDn = "dc=youstream,dc=local"
  baseDn = ${?LDAP_BASE_DN}
  bindDn = "cn=service,ou=system,dc=youstream,dc=local"
  bindDn = ${?LDAP_BIND_DN}
  bindPassword = "service-secret"
  bindPassword = ${?LDAP_BIND_PASSWORD}
  userFilter = "(&(objectClass=inetOrgPerson)(uid={0}))"
  upnDomain = ""
  # attribute mapping
  attributes { id = "entryUUID", username = "uid", displayName = "cn", email = "mail", memberOf = "memberOf" }
  # optional group DNs; empty = not enforced
  requiredGroup = ""
  requiredGroup = ${?LDAP_REQUIRED_GROUP}
  adminGroup = "cn=youstream-admins,ou=groups,dc=youstream,dc=local"
  adminGroup = ${?LDAP_ADMIN_GROUP}
}

# "Sign in with Microsoft" via OpenID Connect (authorization code flow, confidential client)
entra {
  enabled = false
  enabled = ${?ENTRA_ENABLED}
  tenantId = ${?ENTRA_TENANT_ID}
  clientId = ${?ENTRA_CLIENT_ID}
  clientSecret = ${?ENTRA_CLIENT_SECRET}
  redirectUri = "http://localhost:8080/api/auth/microsoft/callback"
  redirectUri = ${?ENTRA_REDIRECT_URI}
  scopes = "openid profile email User.Read"
  # app role value that grants admin rights
  adminRole = "YouStream.Admin"
}

jwt {
  secret = ${?JWT_SECRET}
  accessTtl = 15m
  refreshTtl = 30d
}

auth {
  # Secure flag on auth cookies; browsers accept Secure cookies on http://localhost
  secureCookies = true
  # where the browser lands after "Sign in with Microsoft"; empty = this server.
  # For the Vite dev server set "http://localhost:3000".
  frontendUrl = ""
  frontendUrl = ${?FRONTEND_URL}
}

storage {
  root = "./data"
  root = ${?STORAGE_ROOT}
}

upload {
  maxBytes = 10g
  chunkBytes = 16m
  # per-user limit on stored originals (browser and SFTP); 0 = unlimited
  quotaBytes = 50g
  quotaBytes = ${?UPLOAD_QUOTA}
}

maintenance {
  # cleanup of abandoned uploads, temp folders, old status files, expired tokens.
  # 0 = never in this process (Kubernetes runs "youstream maintenance" as a CronJob instead)
  every = 15m
  every = ${?MAINTENANCE_EVERY}
}

sftp {
  enabled = true
  port = 2222
  port = ${?SFTP_PORT}
  # host name shown to users in the connection instructions
  publicHost = "localhost"
  publicHost = ${?SFTP_PUBLIC_HOST}
  # port shown to users when a load balancer maps another port (22) to this one; 0 = same as port
  publicPort = 0
  publicPort = ${?SFTP_PUBLIC_PORT}
  # created on first start if missing; may be a read-only file shared by all deployments (a Kubernetes secret)
  hostKey = ${storage.root}"/ssh/host_key"
  hostKey = ${?SFTP_HOST_KEY}
  # expect a PROXY protocol header from the load balancer (needed to see client IPs behind it)
  proxyProtocol = false
  proxyProtocol = ${?SFTP_PROXY_PROTOCOL}
  maxFileBytes = 10g
  idleTimeout = 10m
}

media {
  # executables on PATH, or full paths
  ffmpeg = "ffmpeg"
  ffmpeg = ${?FFMPEG}
  ffprobe = "ffprobe"
  ffprobe = ${?FFPROBE}
  workers = 2
  workers = ${?MEDIA_WORKERS}
  segmentSeconds = 6
  # x264 preset: ultrafast..veryslow (faster = quicker encode, larger files)
  preset = "veryfast"
  preset = ${?MEDIA_PRESET}
  # lifetime of signed media URLs for unlisted/private videos
  playbackTokenTtl = 6h
}

include "local.conf"
