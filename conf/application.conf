# YouStream defaults. Put secrets in conf/local.conf (git-ignored) or environment variables.

server {
  port = 8080
  port = ${?HTTP_PORT}
  maxRequestSize = 32m
}

db {
  url = ${?DB_URL}
  user = ${?DB_USER}
  password = ${?DB_PASSWORD}
  poolSize = 10
}

# Username/password login against an LDAP directory (also used for SFTP password auth).
# Defaults point at the embedded dev directory started by youstream-devldap.
ldap {
  enabled = true
  url = "ldap://localhost:10389"
  url = ${?LDAP_URL}
  # "search": bind as service account, find the user with userFilter, then bind as the user (OpenLDAP, lldap, dev LDAP, AD)
  # "upn":    bind directly as username@upnDomain (Active Directory only)
  mode = "search"
  baseDn = "dc=youstream,dc=local"
  baseDn = ${?LDAP_BASE_DN}
  bindDn = "cn=service,ou=system,dc=youstream,dc=local"
  bindDn = ${?LDAP_BIND_DN}
  bindPassword = "service-secret"
  bindPassword = ${?LDAP_BIND_PASSWORD}
  userFilter = "(&(objectClass=inetOrgPerson)(uid={0}))"
  upnDomain = ""
  # attribute mapping
  attributes { id = "entryUUID", username = "uid", displayName = "cn", email = "mail", memberOf = "memberOf" }
  # optional group DNs; empty = not enforced
  requiredGroup = ""
  adminGroup = "cn=youstream-admins,ou=groups,dc=youstream,dc=local"
}

# "Sign in with Microsoft" via OpenID Connect (authorization code flow, confidential client)
entra {
  enabled = false
  tenantId = ${?ENTRA_TENANT_ID}
  clientId = ${?ENTRA_CLIENT_ID}
  clientSecret = ${?ENTRA_CLIENT_SECRET}
  redirectUri = "http://localhost:8080/api/auth/microsoft/callback"
  redirectUri = ${?ENTRA_REDIRECT_URI}
  scopes = "openid profile email User.Read"
  # app role value that grants admin rights
  adminRole = "YouStream.Admin"
}

# Embedded LDAP server for development and tests (youstream-devldap)
devLdap {
  port = 10389
  ldif = "conf/dev-ldap.ldif"
}

jwt {
  secret = ${?JWT_SECRET}
  accessTtl = 15m
  refreshTtl = 30d
}

storage {
  root = "./data"
  root = ${?STORAGE_ROOT}
}

upload {
  maxBytes = 10g
  chunkBytes = 16m
}

sftp {
  port = 2222
  port = ${?SFTP_PORT}
  hostKey = ${storage.root}"/ssh/host_key"
  maxFileBytes = 10g
}

media {
  ffmpeg = "ffmpeg"
  ffmpeg = ${?FFMPEG}
  ffprobe = "ffprobe"
  ffprobe = ${?FFPROBE}
  workers = 2
  segmentSeconds = 6
}

include "local.conf"
