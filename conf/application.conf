# YouStream defaults. Put secrets in conf/local.conf (git-ignored) or environment variables.

server {
  port = 8080
  port = ${?HTTP_PORT}
  maxRequestSize = 32m
}

db {
  url = ${?DB_URL}
  user = ${?DB_USER}
  password = ${?DB_PASSWORD}
  poolSize = 10
}

ldap {
  url = "ldaps://dc.example.com:636"
  url = ${?LDAP_URL}
  # UPN suffix used for bind: user@domain
  domain = "example.com"
  domain = ${?LDAP_DOMAIN}
  baseDn = "DC=example,DC=com"
  baseDn = ${?LDAP_BASE_DN}
  # optional group DNs; empty = not enforced
  requiredGroup = ""
  adminGroup = ""
}

jwt {
  secret = ${?JWT_SECRET}
  accessTtl = 15m
  refreshTtl = 30d
}

storage {
  root = "./data"
  root = ${?STORAGE_ROOT}
}

upload {
  maxBytes = 10g
  chunkBytes = 16m
}

sftp {
  port = 2222
  port = ${?SFTP_PORT}
  hostKey = ${storage.root}"/ssh/host_key"
  maxFileBytes = 10g
}

media {
  ffmpeg = "ffmpeg"
  ffmpeg = ${?FFMPEG}
  ffprobe = "ffprobe"
  ffprobe = ${?FFPROBE}
  workers = 2
  segmentSeconds = 6
}

include "local.conf"
