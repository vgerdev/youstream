// Single source of truth for library versions. Subprojects reference libs.* in their own dependencies.gradle.
ext {
    versions = [
        jooby         : '4.6.0',
        sshd          : '2.20.1',
        hikari        : '7.1.0',
        jcabiJdbc     : '0.19.0',
        postgres      : '42.7.14',
        flyway        : '13.11.1',
        unboundid     : '7.0.5',
        javaJwt       : '4.6.2',
        lombok        : '1.18.48',
        slf4j         : '2.0.20',
        logback       : '1.6.6',
        junit         : '6.1.3',
        assertj       : '3.27.7',
    ]

    libs = [
        // web
        jooby                : "io.jooby:jooby:${versions.jooby}",
        joobyUndertow        : "io.jooby:jooby-undertow:${versions.jooby}",
        joobyJackson         : "io.jooby:jooby-jackson3:${versions.jooby}",
        joobyApt             : "io.jooby:jooby-apt:${versions.jooby}",
        joobyTest            : "io.jooby:jooby-test:${versions.jooby}",

        // sftp
        sshdCore             : "org.apache.sshd:sshd-core:${versions.sshd}",
        sshdSftp             : "org.apache.sshd:sshd-sftp:${versions.sshd}",

        // database
        hikari               : "com.zaxxer:HikariCP:${versions.hikari}",
        jcabiJdbc            : "com.jcabi:jcabi-jdbc:${versions.jcabiJdbc}",
        postgres             : "org.postgresql:postgresql:${versions.postgres}",
        flywayCore           : "org.flywaydb:flyway-core:${versions.flyway}",
        flywayPostgres       : "org.flywaydb:flyway-database-postgresql:${versions.flyway}",

        // auth
        unboundid            : "com.unboundid:unboundid-ldapsdk:${versions.unboundid}",
        javaJwt              : "com.auth0:java-jwt:${versions.javaJwt}",

        // common
        lombok               : "org.projectlombok:lombok:${versions.lombok}",
        slf4jApi             : "org.slf4j:slf4j-api:${versions.slf4j}",
        logback              : "ch.qos.logback:logback-classic:${versions.logback}",

        // test
        junitBom             : "org.junit:junit-bom:${versions.junit}",
        junitJupiter         : 'org.junit.jupiter:junit-jupiter',
        junitLauncher        : 'org.junit.platform:junit-platform-launcher',
        assertj              : "org.assertj:assertj-core:${versions.assertj}",
    ]
}
