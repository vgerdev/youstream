name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: youstream
          POSTGRES_USER: youstream
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U youstream" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - name: Test database configuration
        # integration tests use db.testSchema of the database in conf/local.conf (git-ignored, written here)
        run: |
          cat > conf/local.conf <<'EOF'
          db {
            url = "jdbc:postgresql://localhost:5432/youstream"
            user = youstream
            password = ci-only-password
            testSchema = ci_test
          }
          EOF
      - name: Build
        run: ./gradlew build --no-daemon
      - name: No skipped tests
        # media tests skip without FFmpeg and database tests without a database: in CI both must run
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' */build/test-results/test/*.xml | grep -v 'skipped="0"' || true)
          total=$(grep -ho 'tests="[0-9]*"' */build/test-results/test/*.xml | tr -dc '0-9\n' | paste -sd+ | bc)
          echo "JUnit tests: $total"
          if [ -n "$skipped" ]; then
            grep -l 'skipped="[1-9]' */build/test-results/test/*.xml
            echo "::error::tests were skipped"
            exit 1
          fi
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "*/build/reports/tests/"
          retention-days: 7

  openldap:
    name: OpenLDAP image and LDAP sign-in
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: youstream
          POSTGRES_USER: youstream
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U youstream" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BASE_DN: dc=youstream,dc=ci,dc=test
      SERVICE_DN: cn=youstream,ou=system,dc=youstream,dc=ci,dc=test
      SERVICE_PASSWORD: ci-service-password
      ALICE_PASSWORD: ci-alice-password-1
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t youstream-openldap:ci deploy/openldap
      - name: First start creates the directory
        run: |
          docker run -d --name openldap -p 1389:1389 -v ldapstate:/var/lib/openldap \
            -e LDAP_BASE_DN="$BASE_DN" -e LDAP_BIND_PASSWORD="$SERVICE_PASSWORD" youstream-openldap:ci
          for i in $(seq 1 30); do
            docker exec openldap ldapwhoami -x -H ldap://localhost:1389 -D "$SERVICE_DN" -w "$SERVICE_PASSWORD" && exit 0
            sleep 1
          done
          docker logs openldap
          exit 1
      - name: ldap-user.sh adds a user (kubectl exec mapped to docker exec)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/kubectl" <<'EOF'
          #!/usr/bin/env bash
          # "kubectl ... exec -i openldap-0 -c openldap -- CMD" -> "docker exec -i openldap CMD"
          while [ $# -gt 0 ] && [ "$1" != "--" ]; do shift; done
          shift
          exec docker exec -i openldap "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          printf '%s\n%s\n' "$ALICE_PASSWORD" "$ALICE_PASSWORD" \
            | deploy/openldap/ldap-user.sh add alice "Alice Ünicode" alice@example.com --admin
          deploy/openldap/ldap-user.sh list | tee "$RUNNER_TEMP/list.txt"
          grep -q "memberOf: cn=youstream-users,ou=groups,$BASE_DN" "$RUNNER_TEMP/list.txt"
          grep -q "memberOf: cn=youstream-admins,ou=groups,$BASE_DN" "$RUNNER_TEMP/list.txt"
      - name: Directory rules
        run: |
          fail() { echo "::error::$1"; exit 1; }
          ldap() { docker exec openldap "$@"; }
          # the user can bind; the service account reads entryUUID and memberOf but not passwords
          ldap ldapwhoami -x -H ldap://localhost:1389 -D "uid=alice,ou=people,$BASE_DN" -w "$ALICE_PASSWORD"
          out=$(ldap ldapsearch -LLL -x -H ldap://localhost:1389 -D "$SERVICE_DN" -w "$SERVICE_PASSWORD" \
            -b "ou=people,$BASE_DN" "(uid=alice)" entryUUID memberOf userPassword)
          echo "$out"
          grep -q '^entryUUID: ' <<<"$out" || fail "service account cannot read entryUUID"
          if grep -q '^userPassword' <<<"$out"; then fail "service account can read passwords"; fi
          # passwords are stored hashed ({SSHA}, "e1NTSEF9" in base64)
          stored=$(ldap ldapsearch -LLL -Q -Y EXTERNAL -H ldapi://%2Ftmp%2Fldapi -b "uid=alice,ou=people,$BASE_DN" userPassword)
          grep -Eq '^userPassword(: \{SSHA\}|:: e1NTSEF9)' <<<"$stored" || fail "password not stored as {SSHA}"
          # anonymous binds are refused
          if ldap ldapsearch -x -H ldap://localhost:1389 -b "$BASE_DN" "(uid=alice)" >/dev/null 2>&1; then
            fail "anonymous search allowed"
          fi
      - name: Restart keeps the data and takes the new service password
        run: |
          fail() { echo "::error::$1"; exit 1; }
          restart() {
            docker rm -f openldap >/dev/null
            docker run -d --name openldap -p 1389:1389 -v ldapstate:/var/lib/openldap \
              -e LDAP_BASE_DN="$BASE_DN" -e LDAP_BIND_PASSWORD="$1" youstream-openldap:ci
            for i in $(seq 1 30); do
              docker exec openldap ldapwhoami -x -H ldap://localhost:1389 -D "$SERVICE_DN" -w "$1" && return 0
              sleep 1
            done
            docker logs openldap; fail "service account cannot bind after restart"
          }
          restart rotated-service-password
          if docker exec openldap ldapwhoami -x -H ldap://localhost:1389 -D "$SERVICE_DN" -w "$SERVICE_PASSWORD" 2>/dev/null; then
            fail "old service password still works"
          fi
          docker exec openldap ldapwhoami -x -H ldap://localhost:1389 -D "uid=alice,ou=people,$BASE_DN" -w "$ALICE_PASSWORD"
          restart "$SERVICE_PASSWORD"
          # the backup sidecar's command
          docker exec openldap slapcat -F /var/lib/openldap/slapd.d -n 1 | grep -c '^dn: '
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v5
      - name: YouStream signs in against the directory
        run: |
          ./gradlew installDist -x test --no-daemon -q
          DB_URL=jdbc:postgresql://localhost:5432/youstream DB_USER=youstream DB_PASSWORD=ci-only-password \
          JWT_SECRET=ci-only-jwt-secret-with-enough-length-for-hs256 YOUSTREAM_ROLES=web STORAGE_ROOT="$RUNNER_TEMP/data" \
          LDAP_URL=ldap://localhost:1389 LDAP_BASE_DN="$BASE_DN" LDAP_BIND_DN="$SERVICE_DN" LDAP_BIND_PASSWORD="$SERVICE_PASSWORD" \
          LDAP_REQUIRED_GROUP="cn=youstream-users,ou=groups,$BASE_DN" LDAP_ADMIN_GROUP="cn=youstream-admins,ou=groups,$BASE_DN" \
            youstream-server/build/install/youstream/bin/youstream > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          login() {
            curl -s -o "$RUNNER_TEMP/login.json" -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"username\":\"alice\",\"password\":\"$1\"}" http://localhost:8080/api/auth/login
          }
          code=$(login "$ALICE_PASSWORD"); echo "login: $code"; cat "$RUNNER_TEMP/login.json"; echo
          [ "$code" = 200 ]
          code=$(login wrong-password-123); echo "wrong password: $code"
          [ "$code" = 401 ]
          # disabled users are refused
          deploy/openldap/ldap-user.sh disable alice
          code=$(login "$ALICE_PASSWORD"); echo "disabled: $code"
          [ "$code" != 200 ]
      - name: Logs
        if: always()
        run: |
          docker logs openldap 2>&1 | tail -50 || true
          tail -50 "$RUNNER_TEMP/server.log" 2>/dev/null || true
